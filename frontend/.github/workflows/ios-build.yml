name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble split Unity static library
        run: |
          cd ios/UnityExport/Libraries
          if ls libiPhone-lib.a.part* >/dev/null 2>&1; then
            cat libiPhone-lib.a.part* > libiPhone-lib.a
            rm -f libiPhone-lib.a.part*
            ls -la libiPhone-lib.a
          else
            echo "No split parts found, skipping reassembly"
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Wire Unity-iPhone.xcodeproj into Runner
        run: ruby ios/wire_unity.rb

      - name: Flutter precache iOS
        run: flutter precache --ios

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          BUILD_DIR="build/ios/iphoneos"
          PAYLOAD_DIR="$BUILD_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -r "$BUILD_DIR/Runner.app" "$PAYLOAD_DIR/"
          cd "$BUILD_DIR"
          zip -qr unsigned.ipa Payload
          ls -la unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/ios/iphoneos/unsigned.ipa
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/DiagnosticReports
            build/ios
          retention-days: 7
